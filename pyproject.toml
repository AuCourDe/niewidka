[project]
name = "niewidka"
version = "0.1.0"
description = "Lokalne ukrywanie danych osobowych (pseudonimizacja) w polskich tekstach i dokumentach"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "onnxruntime>=1.31.1",
    "python-stdnum>=1.20",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scipy>=1.17.1",
]

# Grupa eksport ONNX (jednorazowy, K2b): torch/transformers/onnx NIE są potrzebne
# w runtime (inferencja wyłącznie onnxruntime). Torch z indeksu CPU (bez CUDA,
# ~200 MB zamiast ~3 GB z bibliotekami nvidia).
eksport = [
    "onnx>=1.20",
    "torch>=2.9",
    "transformers>=5.11",
]

[tool.uv]
# Na razie biblioteka uruchamiana z katalogu repo (tests/ przez pythonpath);
# pakiet zbudujemy, gdy powstanie punkt wejścia CLI.
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: wymaga pobranych wag w NIEWIDKA_MODELE_KATALOG (pomijane, gdy ich nie ma)",
]
