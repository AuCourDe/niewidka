[project]
name = "niewidka"
version = "0.1.0"
description = "Lokalne ukrywanie danych osobowych (pseudonimizacja) w polskich tekstach i dokumentach"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "onnxruntime>=1.31.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.32",
    "python-stdnum>=1.20",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scipy>=1.17.1",
]

# One-off ONNX export group: torch/transformers/onnx are NOT needed at runtime
# (inference uses onnxruntime only). Torch comes from the CPU index (no CUDA,
# ~200 MB instead of ~3 GB with the nvidia libraries).
eksport = [
    "onnx>=1.20",
    "onnx-ir>=1.0",
    "torch>=2.9",
    "transformers>=5.11",
]

[tool.uv]
# Run from the repository directory (tests/ via pythonpath), not installed as a package.
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: wymaga pobranych wag w NIEWIDKA_MODELE_KATALOG (pomijane, gdy ich nie ma)",
]
