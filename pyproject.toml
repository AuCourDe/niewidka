[project]
name = "niewidka"
version = "0.1.0"
description = "Lokalne ukrywanie danych osobowych (pseudonimizacja) w polskich tekstach i dokumentach"
requires-python = ">=3.11"
dependencies = [
    "python-stdnum>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Na razie biblioteka uruchamiana z katalogu repo (tests/ przez pythonpath);
# pakiet zbudujemy, gdy powstanie punkt wejścia CLI.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
