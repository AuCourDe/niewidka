<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="100%" height="100%" fill="#f8f7f4"/>
  <defs>
    <!-- Sygnet contour gradient: solid navy at bottom-left base, fading to transparent at top-right apex/fold -->
    <linearGradient id="fav-stroke-fade" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#2c4560" stop-opacity="1.0"/>
      <stop offset="45%" stop-color="#2c4560" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#2c4560" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2c4560" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle veil fill for cap interior -->
    <linearGradient id="fav-veil" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c4560" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#2c4560" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2c4560" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Centered Sygnet Cap Icon (Optimized for Favicon 32x32 & App Icon) -->
  <g transform="translate(32, 22)">
    <!-- Base brim band -->
    <path d="M 22 170
             C 62 158, 140 158, 180 170
             C 185 173, 185 185, 180 189
             C 140 200, 62 200, 22 189
             C 17 185, 17 173, 22 170 Z"
          fill="url(#fav-veil)" stroke="url(#fav-stroke-fade)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Crown & Folded Flap -->
    <path d="M 33 164
             C 37 100, 66 45, 102 24
             C 117 14, 137 18, 154 37
             L 178 77
             C 183 85, 175 93, 167 89
             L 140 75
             L 168 164"
          fill="url(#fav-veil)" stroke="url(#fav-stroke-fade)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fold Crease Line -->
    <path d="M 107 22 L 140 75"
          fill="none" stroke="url(#fav-stroke-fade)" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round"/>
  </g>
</svg>
