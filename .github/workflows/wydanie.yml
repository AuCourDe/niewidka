# Wydanie Niewidki (K7b; K7c: przypięte akcje, podział uprawnień, lockfile z haszami).
# Na tag v* buduje aplikację Windows (PyInstaller onedir bez wag), uruchamia testy
# i publikuje ZIP (i instalator, gdy Inno Setup się zbuduje) jako draft wydania.
#
# Bezpieczeństwo (K7c pkt 6/7, audyt):
#   - akcje przypięte do pełnych SHA (ruchomy tag = cudzy kod z uprawnieniami),
#   - budowa z contents: read; zapis tylko w osobnym zadaniu publikacji,
#   - checkout z persist-credentials: false (token nie zostaje w konfiguracji Git),
#   - zależności budowy wyłącznie z lockfile z haszami SHA-256
#     (narzedzia/wymagania-budowy.txt; ten sam plik w narzedzia/zbuduj_windows.ps1).
# Publikacja przez wbudowany gh CLI (bez zewnętrznej akcji wydania).
#
# Pliki Q4 modeli (Podstawowy i Rozszerzony) trafiają do wydania OSOBNO, z maszyny
# z wagami (narzedzia/kwantyzuj_q4.py, eksport K7a), bo ich nie ma na runnerze:
#
#   gh release upload v1.0.0 podstawowy-model.onnx podstawowy-tokenizer.json \
#     podstawowy-config.json rozszerzony-model.onnx rozszerzony-tokenizer.json \
#     rozszerzony-config.json SHA256SUMS --clobber
#
# Nazwy plików muszą zgadzać się z polem "zrodlo" w niewidka/dane/pakiety.json
# (program pobiera {NIEWIDKA_MODELE_ZRODLO}/{zrodlo}).
#
# Dry-run bez tagu: uruchom workflow ręcznie (workflow_dispatch) — artefakty
# budują się i lądują w zakładce Actions, wydanie NIE powstaje.

name: wydanie

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Zależności (lockfile z haszami, K7c pkt 7)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r narzedzia/wymagania-budowy.txt

      - name: "Testy (bez wag: testy modelowe same skaczą)"
        shell: pwsh
        run: python -m pytest tests/ -q

      - name: Budowa PyInstaller (skrypt budowy, istniejące repo bez klonu)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File narzedzia/zbuduj_windows.ps1 `
            -KatalogBudowy "$env:GITHUB_WORKSPACE\budowa" `
            -Rpo "$env:GITHUB_WORKSPACE" `
            -Python "python"

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\budowa\*.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$($hash)  $($zip.Name)" | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE\budowa\SHA256SUMS"
          Get-Content "$env:GITHUB_WORKSPACE\budowa\SHA256SUMS"

      - name: Artefakty (dry-run i wydanie)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: niewidka-windows
          path: |
            budowa/*.zip
            budowa/SHA256SUMS
            budowa/instalator/*.exe

  publikacja:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobranie artefaktów budowy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -n niewidka-windows -D artefakty

      - name: Publikacja draft wydania (gh CLI, bez zewnętrznej akcji)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Niewidka $TAG" \
              --notes "Zainstaluj: rozpakuj ZIP i uruchom Niewidka.exe (albo użyj instalatora). Przy pierwszym uruchomieniu program zaproponuje pobranie pakietów modeli."
          gh release upload "$TAG" artefakty/*.zip artefakty/SHA256SUMS artefakty/instalator/*.exe --clobber
