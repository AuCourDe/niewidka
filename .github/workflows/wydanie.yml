# Niewidka release. Pinned actions, split permissions, lockfile with hashes.
# On a v* tag it builds the Windows app (PyInstaller onedir, no weights), runs the tests
# and publishes the ZIP (and the installer, if Inno Setup builds) as a draft release.
#
# Security:
#   - actions are pinned to full SHAs (a movable tag is someone else's code with permissions),
#   - the build runs with contents: read; write access only in a separate publish job,
#   - checkout uses persist-credentials: false (the token stays out of the Git config),
#   - build dependencies come only from a lockfile with SHA-256 hashes
#     (narzedzia/wymagania-budowy.txt; the same file in narzedzia/zbuduj_windows.ps1).
# Publishing uses the built-in gh CLI (no external release action).
#
# The Q4 model files (Podstawowy and Rozszerzony) are uploaded to the release SEPARATELY,
# from a machine that has the weights (narzedzia/kwantyzuj_q4.py), because the runner lacks them:
#
#   gh release upload v1.0.0 podstawowy-model.onnx podstawowy-tokenizer.json \
#     podstawowy-config.json rozszerzony-model.onnx rozszerzony-tokenizer.json \
#     rozszerzony-config.json SHA256SUMS.txt --clobber
#
# File names must match the "zrodlo" field in niewidka/dane/pakiety.json
# (the program downloads {NIEWIDKA_MODELE_ZRODLO}/{zrodlo}).
#
# Dry run without a tag: start the workflow manually (workflow_dispatch); the artifacts
# are built and land in the Actions tab, no release is created.

name: wydanie

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Zależności (lockfile z haszami)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r narzedzia/wymagania-budowy.txt

      - name: "Testy (bez wag: testy modelowe same skaczą)"
        shell: pwsh
        run: python -m pytest tests/ -q

      - name: Budowa PyInstaller (skrypt budowy, istniejące repo bez klonu)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File narzedzia/zbuduj_windows.ps1 `
            -KatalogBudowy "$env:GITHUB_WORKSPACE\budowa" `
            -Rpo "$env:GITHUB_WORKSPACE" `
            -Python "python" `
            -PominTesty

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\budowa\*.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$($hash)  $($zip.Name)" | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE\budowa\SHA256SUMS"
          Get-Content "$env:GITHUB_WORKSPACE\budowa\SHA256SUMS"

      - name: Artefakty (dry-run i wydanie)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: niewidka-windows
          path: |
            budowa/*.zip
            budowa/SHA256SUMS
            budowa/instalator/*.exe

  publikacja:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobranie artefaktów budowy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" -n niewidka-windows -D artefakty

      - name: Publikacja draft wydania (gh CLI, bez zewnętrznej akcji)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Niewidka $TAG" \
              --notes "Zainstaluj: rozpakuj ZIP i uruchom Niewidka.exe (albo użyj instalatora). Przy pierwszym uruchomieniu program zaproponuje pobranie pakietów modeli."
          # The installer is optional (built only when Inno Setup is present on the runner).
          shopt -s nullglob
          pliki=(artefakty/*.zip artefakty/instalator/*.exe)
          for f in "${pliki[@]}"; do sha256sum "$f" | sed 's#  .*/#  #' > "$f.sha256"; done
          gh release upload "$TAG" "${pliki[@]}" artefakty/*.sha256 artefakty/instalator/*.sha256 --clobber
